<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Seven Academy – Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0c0c0e;--cd:#17171b;--cd2:#212127;--ac:#ff6a1a;--tx:#f5f5f6;--mu:#8d8d97;--ok:#3ddc84;--bad:#ff4d5e;--wn:#ffc233;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 "Barlow","Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:var(--cd2);padding:9px 14px;border-radius:10px;transition:.15s}button:hover{filter:brightness(1.2)}
.pr{background:var(--ac);color:#111;font-weight:700}.gh{background:none;border:1px solid #33333b}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid #222;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px}.brand img{width:38px;height:38px;border-radius:50%}
.seg{display:flex;background:var(--cd);border-radius:12px;padding:3px}.seg button{background:none;padding:7px 16px}.seg .on{background:var(--ac);color:#111;font-weight:700}
.demo{position:fixed;right:10px;bottom:10px;background:var(--wn);color:#111;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;z-index:50}
.fade{animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--cd);border-radius:16px;padding:14px;margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mu{color:var(--mu);font-size:13px}h2{font-size:20px;margin:4px 0 10px}h3{font-size:15px;margin-bottom:8px}.big{font-size:30px;font-weight:800}
.tag{font-size:12px;padding:2px 9px;border-radius:20px;background:var(--cd2)}.ok{color:var(--ok)}.bad{color:var(--bad)}.wn{color:var(--wn)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.chips button{white-space:nowrap;padding:6px 12px}.chips .on{background:var(--ac);color:#111}
.phone{width:100%;max-width:390px;margin:16px auto;height:calc(100vh - 100px);min-height:620px;max-height:780px;background:var(--bg);border:1px solid #2a2a31;border-radius:34px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 8px #151518}
.scr{flex:1;overflow:auto;padding:16px}.nav{display:flex;background:var(--cd);border-top:1px solid #222}.nav button{flex:1;background:none;border-radius:0;padding:10px 0;font-size:11px;color:var(--mu)}.nav .on{color:var(--ac)}.nav b{display:block;font-size:18px}
.bar{height:8px;background:var(--cd2);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.dash{max-width:1100px;margin:0 auto;padding:16px}.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button.on{background:var(--ac);color:#111;font-weight:700}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 6px;text-align:left;border-bottom:1px solid #26262c}th{color:var(--mu);font-weight:500}
.wrap{overflow-x:auto}.bars{display:flex;align-items:flex-end;gap:8px;height:130px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bars i{display:block;background:var(--ac);border-radius:6px 6px 0 0;margin-bottom:4px}
.mod{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}.mod>div{background:var(--cd);border-radius:20px;padding:20px;max-width:380px;width:100%;max-height:90vh;overflow:auto}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;border:1px solid #33333b;background:none}.opt.on{border-color:var(--ac)}
input,textarea,select{width:100%;background:var(--cd2);border:1px solid #33333b;color:var(--tx);border-radius:10px;padding:9px;font:inherit;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ok);color:#111;font-weight:700;padding:9px 18px;border-radius:30px;z-index:70}
.badge{text-align:center;padding:10px 4px;background:var(--cd2);border-radius:12px;font-size:12px}.badge b{display:block;font-size:26px}.lock{opacity:.35}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid #444;display:inline-flex;align-items:center;justify-content:center;padding:0;background:none}.chk.on{background:var(--ok);border-color:var(--ok);color:#111}
</style></head><body>

<div class="seg" id="roles"></div></header><div id="app"></div><div class="demo">Demo Mode</div><div id="ov"></div>
<script>
const $=s=>document.querySelector(s),S={role:'client',ct:'home',ot:'ov',kt:'cl',day:0,sp:'All',booked:[1],plan:null,frozen:false,pts:1240,cs:null,att:{}};
const SP=['Calisthenics','Boxing','Yoga','Functional'],IC={Calisthenics:'🤸',Boxing:'🥊',Yoga:'🧘',Functional:'🏋️'};
const CO={Calisthenics:'Ahmed Fathy',Boxing:'Karim Adel',Yoga:'Mona Salah',Functional:'Omar Nabil'},DAYS=['Sat','Sun','Mon','Tue','Wed','Thu'],TM=['07:00','09:00','17:00','19:00','20:30'];
let CL=[];DAYS.forEach((d,di)=>TM.forEach((t,i)=>{const sp=SP[(di+i)%4],cap=sp=='Boxing'?10:14,tk=Math.min(cap,Math.round(cap*(.45+Math.abs(Math.sin(di*7+i*3))*.6)));CL.push({id:di*10+i,d:di,t,sp,co:CO[sp],room:i%2?'Hall B':'Hall A',cap,tk})}));
const N=['Youssef Hamdy','Nour El-Din','Salma Ibrahim','Mostafa Gamal','Hana Mahmoud','Ali Tarek','Farida Samir','Hossam Reda','Mariam Khaled','Adham Sherif','Dina Ashraf','Belal Ayman','Jana Wael','Seif Mansour','Rana Essam','Tamer Fouad','Laila Nasser','Zeyad Hatem','Nada Osama','Kareem Lotfy'];
const PL=['Monthly','3 Months','Yearly','Multi-sport','Student'];
const M=N.map((n,i)=>({n,sp:SP[i%4],last:[0,1,2,3,1,14,2,12,0,4,16,1,3,9,0,2,21,1,5,3][i],end:[20,9,45,3,60,4,12,25,2,80,8,33,5,15,28,1,-4,40,6,19][i],pl:PL[i%5]})).map(m=>({...m,st:m.n=='Laila Nasser'||m.end<0?'Expired':m.n=='Rana Essam'?'Frozen':'Active'}));
const risk=m=>m.last>14||m.end<=3?'High':m.last>10||m.end<=5?'Medium':m.last>7?'Low':null;
const AR=M.filter(m=>m.st!='Expired'&&(m.last>10||m.end<=5)).concat(M.filter(m=>m.st=='Expired'));
const PR={Monthly:[600,'30 days'],'3 Months':[1600,'90 days'],Yearly:[5500,'365 days'],'Multi-sport':[900,'30 days · all sports'],Student:[450,'30 days · ID required']};
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)};
const modal=h=>{$('#ov').innerHTML=`<div class="mod" onclick="if(event.target==this)closeM()"><div class="fade">${h}</div></div>`},closeM=()=>$('#ov').innerHTML='';
const line=(d,w=300,h=100)=>{const mx=Math.max(...d),mn=Math.min(...d),p=d.map((v,i)=>[i*w/(d.length-1),h-10-(v-mn)/(mx-mn||1)*(h-24)]),s=p.map(a=>a.join(',')).join(' ');return`<svg viewBox="0 0 ${w} ${h}" width="100%"><polygon points="0,${h} ${s} ${w},${h}" fill="#ff6a1a22"/><polyline points="${s}" fill="none" stroke="#ff6a1a" stroke-width="3" stroke-linejoin="round"/>${p.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="3.5" fill="#ff6a1a"/>`).join('')}</svg>`};
const bars=(d,l,u='')=>{const mx=Math.max(...d);return`<div class="bars">${d.map((v,i)=>`<div><span>${v}${u}</span><i style="height:${v/mx*90}px"></i>${l[i]}</div>`).join('')}</div>`};
const qr=()=>{let r='';for(let i=0;i<21;i++)for(let j=0;j<21;j++){let a,b,f=0;if(i<7&&j<7){a=i;b=j;f=1}else if(i<7&&j>13){a=i;b=j-14;f=1}else if(i>13&&j<7){a=i-14;b=j;f=1}const on=f?(a==0||a==6||b==0||b==6||(a>1&&a<5&&b>1&&b<5)):Math.sin(i*12.9+j*78.2)*43758>.0&&Math.abs(Math.sin(i*91.3+j*17.7)*1e4)%1>.5;if(on)r+=`<rect x="${j}" y="${i}" width="1" height="1"/>`}return`<svg viewBox="-1 -1 23 23" width="170" style="background:#fff;border-radius:10px;padding:4px"><g fill="#111">${r}</g></svg>`};
function setRole(r){S.role=r;render()}
function render(){$('#roles').innerHTML=['client','coach','owner'].map(r=>`<button class="${S.role==r?'on':''}" onclick="setRole('${r}')">${r[0].toUpperCase()+r.slice(1)}</button>`).join('');$('#app').innerHTML=S.role=='client'?client():S.role=='coach'?coach():owner()}
/* ---------- CLIENT ---------- */
function client(){const T=[['home','🏠','Home'],['book','📅','Book'],['rew','🏆','Rewards'],['pay','💳','Pay'],['prog','📈','Progress']];
const v={home:cHome,book:cBook,rew:cRew,pay:cPay,prog:cProg}[S.ct]();
return`<div class="phone"><div class="scr fade" id="scr">${v}</div><div class="nav">${T.map(t=>`<button class="${S.ct==t[0]?'on':''}" onclick="S.ct='${t[0]}';render()"><b>${t[1]}</b>${t[2]}</button>`).join('')}</div></div>`}
function cHome(){const nx=CL.find(c=>S.booked.includes(c.id))||CL[0];return`<p class="mu">Good evening</p><h2>Youssef, let's train 💪</h2>
<div class="card" style="background:linear-gradient(135deg,#ff6a1a,#c2410c);color:#111"><div class="row"><b>${S.plan||'Multi-sport'} plan</b><span class="tag" style="background:#0003">${S.frozen?'Frozen':'Active'}</span></div><div class="big">18 days left</div><div class="bar" style="background:#0003;margin-top:6px"><i style="width:40%;background:#111"></i></div></div>
<div class="g4" style="grid-template-columns:1fr 1fr"><div class="card"><span class="mu">Streak</span><div class="big">🔥 12</div><span class="mu">days in a row</span></div><div class="card"><span class="mu">Level 7</span><div class="big">${S.pts}</div><span class="mu">points</span></div></div>
<div class="card"><h3>Next class</h3><div class="row"><div><b>${IC[nx.sp]} ${nx.sp}</b><div class="mu">${DAYS[nx.d]} ${nx.t} · ${nx.co} · ${nx.room}</div></div><button class="pr" onclick="showQR(${nx.id})">QR</button></div></div>
<div class="card"><h3>Seven Challenge</h3><div class="mu">Train 7 days, earn 700 pts</div><div class="bar" style="margin-top:8px"><i style="width:57%"></i></div><div class="mu" style="margin-top:4px">4 of 7 days</div></div>`}
function showQR(id){const c=CL.find(x=>x.id==id);modal(`<h3>Check-in code</h3><div style="text-align:center">${qr()}<p style="margin:10px 0"><b>${c.sp}</b><br><span class="mu">${DAYS[c.d]} ${c.t} · ${c.room}</span></p></div><button class="pr" style="width:100%" onclick="closeM()">Done</button>`)}
function cBook(){const l=CL.filter(c=>c.d==S.day&&(S.sp=='All'||c.sp==S.sp));return`<h2>Book a class</h2><div class="chips">${DAYS.map((d,i)=>`<button class="${S.day==i?'on':''}" onclick="S.day=${i};render()">${d}</button>`).join('')}</div>
<div class="chips">${['All',...SP].map(s=>`<button class="${S.sp==s?'on':''}" onclick="S.sp='${s}';render()">${s}</button>`).join('')}</div>
${l.map(c=>{const full=c.tk>=c.cap,bk=S.booked.includes(c.id);return`<div class="card"><div class="row"><div><b>${IC[c.sp]} ${c.sp}</b><div class="mu">${c.t} · ${c.co} · ${c.room}</div><div class="${full?'bad':c.cap-c.tk<4?'wn':'ok'}" style="font-size:13px">${full?'Full':(c.cap-c.tk)+' spots left'} (${c.tk}/${c.cap})</div></div>
<button class="${bk?'gh':'pr'}" onclick="book(${c.id})">${bk?'Booked ✓':full?'Join Waitlist':'Book'}</button></div></div>`}).join('')||'<p class="mu">No classes match. Try another sport.</p>'}`}
function book(id){const c=CL.find(x=>x.id==id);if(S.booked.includes(id))return showQR(id);if(c.tk>=c.cap){toast("You're #3 on the waitlist");return}S.booked.push(id);c.tk++;render();showQR(id)}
function cRew(){const B=[['🔥','30 Day Commitment',1],['💪','First Muscle-Up',1],['🌅','Early Bird',1],['🥊','Boxing Rookie',1],['🧘','Zen Master',0],['🏅','100 Classes',0]];
const LB=[['Nour El-Din',2310],['Salma Ibrahim',1980],['Youssef Hamdy',S.pts],['Mostafa Gamal',1105],['Hana Mahmoud',990]].sort((a,b)=>b[1]-a[1]);
return`<h2>Rewards</h2><div class="card"><div class="row"><b>Level 7 · Contender</b><span class="mu">${S.pts}/1500</span></div><div class="bar" style="margin:8px 0"><i style="width:${S.pts/15}%"></i></div><button class="pr" onclick="S.pts+=50;toast('+50 pts for check-in');render()">Simulate check-in +50</button></div>
<h3>Badges</h3><div class="g4" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">${B.map(b=>`<div class="badge ${b[2]?'':'lock'}"><b>${b[0]}</b>${b[1]}</div>`).join('')}</div>
<div class="card"><h3>7-Day Seven Challenge</h3><div class="row" style="justify-content:flex-start">${[1,1,1,1,0,0,0].map(x=>`<span class="chk ${x?'on':''}">${x?'✓':''}</span>`).join('')}</div><p class="mu" style="margin-top:6px">Ends in 3 days · prize: free PT session</p></div>
<div class="card"><h3>October leaderboard</h3>${LB.map((l,i)=>`<div class="row" style="padding:5px 0;${l[0]=='Youssef Hamdy'?'color:var(--ac);font-weight:700':''}"><span>${['🥇','🥈','🥉','4','5'][i]} ${l[0]}</span><span>${l[1]}</span></div>`).join('')}</div>`}
function cPay(){return`<h2>Membership</h2>${PL.map(p=>`<div class="card row"><div><b>${p}</b><div class="mu">${PR[p][1]}</div></div><button class="pr" onclick="checkout('${p}')">${PR[p][0]} EGP</button></div>`).join('')}
<button class="gh" style="width:100%" onclick="S.frozen=!S.frozen;toast(S.frozen?'Membership frozen':'Membership resumed');render()">${S.frozen?'❄️ Resume membership':'❄️ Freeze membership'}</button>`}
function checkout(p,m='Vodafone Cash'){modal(`<h3>Checkout · ${p}</h3><p class="big">${PR[p][0]} EGP</p>${['Vodafone Cash','Card','Fawry'].map(x=>`<button class="opt ${x==m?'on':''}" onclick="checkout('${p}','${x}')">${{'Vodafone Cash':'📱','Card':'💳','Fawry':'🏪'}[x]} ${x}</button>`).join('')}<button class="pr" style="width:100%;margin-top:6px" onclick="paid('${p}','${m}')">Pay ${PR[p][0]} EGP</button>`)}
function paid(p,m){S.plan=p;S.pts+=100;modal(`<div style="text-align:center"><div style="font-size:50px">✅</div><h3>Payment successful</h3></div><div class="card"><div class="row"><span class="mu">Plan</span>${p}</div><div class="row"><span class="mu">Method</span>${m}</div><div class="row"><span class="mu">Amount</span>${PR[p][0]} EGP</div><div class="row"><span class="mu">Receipt</span>#SA-20481</div></div><button class="pr" style="width:100%" onclick="closeM();S.ct='home';render()">Back to home</button>`)}
function cProg(){return`<h2>My progress</h2><div class="card"><div class="row"><h3>Weight (kg)</h3><span class="ok">−4.2 kg</span></div>${line([82,81.5,80.2,79.8,78.9,78.4,77.8])}<div class="row mu"><span>Aug</span><span>Oct</span></div></div>
<div class="card"><h3>Personal records</h3>${[['Pull-ups','14 reps'],['Dips','22 reps'],['Plank','3:10 min'],['Muscle-up','2 reps 🎉']].map(r=>`<div class="row" style="padding:4px 0"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>
<div class="card"><h3>Program from Coach Ahmed</h3>${[['Pull-ups','4 × 8'],['Ring dips','3 × 10'],['Pike push-ups','3 × 12'],['Hanging leg raises','4 × 10'],['L-sit hold','5 × 15s']].map(r=>`<div class="row" style="padding:5px 0;border-bottom:1px solid #26262c"><span>${r[0]}</span><b class="ac" style="color:var(--ac)">${r[1]}</b></div>`).join('')}</div>`}
/* ---------- COACH ---------- */
function coach(){const T=[['cl','Today\'s classes'],['cs','My clients'],['pt','PT sessions'],['er','Earnings']];
return`<div class="dash fade"><div class="row"><h2>Coach Ahmed Fathy</h2><span class="tag">Calisthenics</span></div><div class="tabs">${T.map(t=>`<button class="${S.kt==t[0]?'on':''}" onclick="S.kt='${t[0]}';S.cs=null;render()">${t[1]}</button>`).join('')}</div>${{cl:kClasses,cs:kClients,pt:kPT,er:kEarn}[S.kt]()}</div>`}
function kClasses(){return[CL[0],CL[2],CL[4]].map((c,k)=>{const at=M.slice(k*3,k*3+7);return`<div class="card"><div class="row"><div><b>${IC[c.sp]} ${c.sp} · ${c.t}</b><div class="mu">${c.room} · ${at.length} booked</div></div><button class="pr" onclick="at(${k},${at.length})">Mark all present</button></div><div style="margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px">${at.map((m,i)=>`<div class="row" style="background:var(--cd2);padding:7px 10px;border-radius:10px"><span>${m.n}</span><button class="chk ${S.att[k+'-'+i]?'on':''}" onclick="S.att['${k}-${i}']=!S.att['${k}-${i}'];render()">${S.att[k+'-'+i]?'✓':''}</button></div>`).join('')}</div></div>`}).join('')}
function at(k,n){for(let i=0;i<n;i++)S.att[k+'-'+i]=true;toast('Attendance saved');render()}
function kClients(){if(S.cs!==null){const m=M[S.cs];return`<button class="gh" onclick="S.cs=null;render()">← Back</button><div class="g2" style="margin-top:12px"><div class="card"><h3>${m.n}</h3><p class="mu">Goal: first muscle-up &amp; lose 5 kg</p><p class="wn" style="margin:8px 0">⚠ Injury: mild left shoulder strain (Aug)</p><p class="mu">Notes: strong pulling, work on scapular control. Prefers evening classes.</p><div class="mu" style="margin:10px 0">Attendance (last 4 weeks)</div>${bars([4,3,5,4],['W1','W2','W3','W4'])}<div class="mu">Measurements: 78 kg · waist 84 cm · chest 101 cm</div></div>
<div class="card"><h3>Assign workout program</h3><input placeholder="Program name" value="Strength block 3"><textarea rows="5">Pull-ups 4×8&#10;Ring rows 3×12&#10;Pike push-ups 3×10</textarea><select><option>4 weeks</option><option>8 weeks</option></select><button class="pr" style="width:100%" onclick="toast('Program sent to ${m.n.split(' ')[0]}')">Send to client</button></div></div>`}
return`<input placeholder="Search clients…" oninput="sq(this.value)"><div id="cll">${cll('')}</div>`}
const cll=q=>`<div class="g2">${M.map((m,i)=>[m,i]).filter(x=>x[0].n.toLowerCase().includes(q.toLowerCase())).map(([m,i])=>`<div class="card row" style="margin:0;cursor:pointer" onclick="S.cs=${i};render()"><div><b>${m.n}</b><div class="mu">${m.sp} · ${m.pl}</div></div><span class="tag">View file</span></div>`).join('')}</div>`;
const sq=q=>$('#cll').innerHTML=cll(q);
function kPT(){return`<div class="card wrap"><table><tr><th>Client</th><th>Remaining</th><th>Next session</th><th></th></tr>${[['Youssef Hamdy',6,12,'Sun 18:00'],['Salma Ibrahim',2,12,'Mon 17:00'],['Ali Tarek',9,12,'Wed 09:00'],['Dina Ashraf',1,8,'Thu 19:00']].map(r=>`<tr><td>${r[0]}</td><td><b class="${r[1]<3?'wn':''}">${r[1]}</b> / ${r[2]}</td><td>${r[3]}</td><td><button onclick="toast('Reminder sent')">Remind</button></td></tr>`).join('')}</table></div>`}
function kEarn(){return`<div class="g4"><div class="card"><span class="mu">October earnings</span><div class="big">18,450</div><span class="ok">+12% vs Sep</span></div><div class="card"><span class="mu">Group classes</span><div class="big">64</div></div><div class="card"><span class="mu">PT sessions</span><div class="big">27</div></div></div><div class="card"><h3>Last 6 months (EGP)</h3>${bars([12.1,13.4,14.2,15.8,16.5,18.4],['May','Jun','Jul','Aug','Sep','Oct'],'k')}</div>`}
/* ---------- OWNER ---------- */
function owner(){const T=[['ov','Overview'],['rt','Retention'],['mb','Members'],['fn','Finance & plans']];
return`<div class="dash fade"><h2>Owner dashboard</h2><div class="tabs">${T.map(t=>`<button class="${S.ot==t[0]?'on':''}" onclick="S.ot='${t[0]}';render()">${t[1]}${t[0]=='rt'?` <span class="tag" style="background:var(--bad)">${AR.length}</span>`:''}</button>`).join('')}</div>${{ov:oOv,rt:oRt,mb:oMb,fn:oFn}[S.ot]()}</div>`}
function oOv(){return`<div class="g4" style="margin-bottom:12px">${[['Revenue today','8,400 EGP'],['This month','212,600 EGP'],['Active members','187'],['New this month','23'],['Expiring soon','14']].map(k=>`<div class="card" style="margin:0"><span class="mu">${k[0]}</span><div class="big" style="font-size:24px">${k[1]}</div></div>`).join('')}</div>
<div class="g2"><div class="card"><h3>Revenue (EGP k)</h3>${line([140,155,160,178,190,212],320,110)}<div class="row mu"><span>May</span><span>Oct</span></div></div><div class="card"><h3>Class occupancy by sport</h3>${bars([86,92,71,64],SP.map(s=>s.slice(0,6)),'%')}</div>
<div class="card"><h3>Best time slots</h3>${[['19:00',94],['20:30',88],['17:00',79],['07:00',58],['09:00',41]].map(r=>`<div style="margin-bottom:8px"><div class="row mu"><span>${r[0]}</span><span>${r[1]}% full</span></div><div class="bar"><i style="width:${r[1]}%"></i></div></div>`).join('')}<p class="wn" style="font-size:13px">💡 09:00 slots are under 45%. Consider merging them.</p></div>
<div class="card"><h3>Top sports by revenue</h3>${bars([62,48,31,24],SP.map(s=>s.slice(0,6)),'k')}</div></div>`}
function oRt(){return`<p class="mu" style="margin-bottom:10px">Members absent for 10+ days or expiring within 5 days.</p><div class="card wrap"><table><tr><th>Member</th><th>Risk</th><th>Last visit</th><th>Expires</th><th></th></tr>${AR.map((m,i)=>{const r=risk(m)||'High';return`<tr><td><b>${m.n}</b><div class="mu">${m.sp}</div></td><td><span class="tag ${r=='High'?'bad':r=='Medium'?'wn':'ok'}">${r}</span></td><td>${m.last}d ago</td><td>${m.end<0?'Expired':m.end+'d'}</td><td><button class="pr" onclick="wa(${i})">WhatsApp</button></td></tr>`}).join('')}</table></div>`}
function wa(i){const m=AR[i],t=m.end<=5?`Hi ${m.n.split(' ')[0]}! Your Seven Academy plan ends soon. Renew now and get 10% off 🔥`:`Hi ${m.n.split(' ')[0]}, we miss you at Seven Academy! Come to today's ${m.sp} class 💪`;modal(`<h3>WhatsApp to ${m.n}</h3><div style="background:#075e54;padding:12px;border-radius:12px;margin-bottom:10px">${t}</div><div class="row"><button class="gh" onclick="closeM()">Cancel</button><button class="pr" onclick="closeM();toast('Message sent')">Send</button></div>`)}
function oMb(){return`<div class="card wrap"><table><tr><th>Member</th><th>Plan</th><th>Sport</th><th>Status</th><th>Ends in</th></tr>${M.map(m=>`<tr><td>${m.n}</td><td>${m.pl}</td><td>${m.sp}</td><td class="${m.st=='Active'?'ok':m.st=='Frozen'?'wn':'bad'}">${m.st}</td><td>${m.end<0?'—':m.end+'d'}</td></tr>`).join('')}</table></div>`}
function oFn(){return`<div class="g2"><div class="card"><h3>Income vs expenses (EGP k)</h3><div class="row mu"><span>Income</span><b class="ok">212.6</b></div><div class="bar"><i style="width:100%;background:var(--ok)"></i></div><div class="row mu" style="margin-top:8px"><span>Expenses</span><b class="bad">131.0</b></div><div class="bar"><i style="width:62%;background:var(--bad)"></i></div><p class="big" style="margin-top:12px">81.6k <span class="mu" style="font-size:14px">net profit</span></p><p class="mu">Rent 60k · Salaries 55k · Utilities 9k · Equipment 7k</p></div>
<div class="card"><h3>Plans &amp; pricing</h3>${PL.map(p=>`<div class="row" style="padding:5px 0"><span>${p}</span><input type="number" style="width:90px;margin:0" value="${PR[p][0]}" onchange="PR['${p}'][0]=this.value;toast('Price updated')"></div>`).join('')}</div></div>`}
render();
</script></body></html>
