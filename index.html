<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANTIGO – Store System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ---- Theme tokens (light / dark follows system) ---- */
:root{--bg:#f6f1ea;--card:#fff;--ink:#26231f;--mut:#7a726a;--line:#e6ded3;--acc:#b8613f;--ok:#3f8a5a;--warn:#c9962b;--bad:#c0463c;--info:#4a78a8;--side:#26231f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1816;--card:#262320;--ink:#f1ebe3;--mut:#a39a90;--line:#38332e;--side:#12100f}}
:root[data-theme="dark"]{--bg:#1a1816;--card:#262320;--ink:#f1ebe3;--mut:#a39a90;--line:#38332e;--side:#12100f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;transition:background .3s}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{display:flex;min-height:100vh}
aside{width:220px;background:var(--side);color:#f1ebe3;padding:22px 14px;position:sticky;top:0;height:100vh;flex:none;transition:transform .25s}
aside .logo{font-family:'Playfair Display',serif;font-size:26px;letter-spacing:.14em;padding:0 10px 22px}
aside .logo span{color:var(--acc)}
.nav{display:block;width:100%;text-align:start;background:none;border:0;color:#cfc6bb;padding:10px 12px;border-radius:10px;margin-bottom:4px;transition:.2s}
.nav:hover{background:#ffffff14}.nav.on{background:var(--acc);color:#fff}
.main{flex:1;min-width:0}
header{display:flex;gap:10px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
header .sp{flex:1}
.burger{display:none}
.ib,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px}
.bell{position:relative}
.bell b{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px}
.dd{position:absolute;top:110%;inset-inline-end:0;width:300px;max-height:360px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px #0003;z-index:20}
.dd div{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}.dd small{color:var(--mut);display:block}
section.pg{padding:22px;max-width:1280px}
.title{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card h3{font-size:17px;margin-bottom:10px}
.kpi small{color:var(--mut)}.kpi .v{font:700 24px 'Playfair Display',serif;margin:4px 0}
.up{color:var(--ok)}.dn{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:start;padding:8px 6px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}
.wrap{overflow-x:auto}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;color:#fff;white-space:nowrap}
.p-ontime,.p-P{background:var(--ok)}.p-late,.p-L{background:var(--warn)}.p-absent,.p-A{background:var(--bad)}.p-leave,.p-V{background:var(--info)}.p-none,.p-O{background:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .5s}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 14px;transition:.2s}.btn:hover{filter:brightness(1.1)}
.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:none;padding:6px 12px}.seg .on{background:var(--ink);color:var(--bg)}
.feed div{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;font-size:13px}.feed small{color:var(--mut);white-space:nowrap}
.empty{color:var(--mut);padding:14px;text-align:center}
svg text{fill:var(--mut);font-size:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.cal div{padding:8px 0;border-radius:8px;font-size:12px}.cal .h{color:var(--mut)}
.cal .p-P,.cal .p-L,.cal .p-A,.cal .p-V,.cal .p-O{color:#fff}
.big{font:700 52px 'Playfair Display',serif;text-align:center}
.bigbtn{display:block;margin:12px auto;width:240px;height:240px;border-radius:50%;font:600 22px Inter;border:0;color:#fff;background:var(--acc);box-shadow:0 0 0 12px #b8613f22;transition:.2s}
.bigbtn.out{background:var(--ink);color:var(--bg)}.bigbtn:active{transform:scale(.97)}
.tg{width:44px;height:24px;border-radius:99px;border:0;background:var(--line);position:relative;transition:.2s;flex:none}
.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--ok)}.tg.on::after{inset-inline-start:23px}
.acard{display:flex;gap:12px;align-items:flex-start}.acard p{margin:2px 0;color:var(--mut);font-size:13px}
.wa{background:#dcf8c6;color:#222;border-radius:12px;padding:10px 12px;white-space:pre-line;max-width:340px;font-size:13px}
#toast{position:fixed;bottom:20px;inset-inline-end:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
#toast div{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;max-width:320px;animation:in .3s both;box-shadow:0 8px 20px #0004}
.shift{cursor:pointer;text-align:center}.shift:hover{background:var(--line)}
input[type=number],input[type=date],input[type=time],input[type=text]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
@media(max-width:860px){aside{position:fixed;z-index:30;transform:translateX(-100%);inset-inline-start:0}[dir=rtl] aside{transform:translateX(100%)}aside.open{transform:none!important}.burger{display:inline-block}section.pg{padding:14px}.g2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
/* ===== i18n (nav + main headings; rest stays English) ===== */
const L={en:{dash:'Dashboard',att:'Attendance',inv:'Inventory',auto:'Automations',all:'All branches',today:"Today's sales",month:'30-day sales',orders:'Orders',aov:'Avg. order',profit:'Net profit',owner:'Owner',emp:'Employee',lang:'AR',trend:'Sales over time',cmp:'Branch comparison (7 days)',top:'Top 5 products',cat:'Sales by category',low:'Low stock',dead:'Dead stock (60+ days)',lead:'Employee leaderboard',feed:'Recent activity',sim:'Simulate an event'},
ar:{dash:'لوحة التحكم',att:'الحضور والانصراف',inv:'المخزون',auto:'الأتمتة',all:'كل الفروع',today:'مبيعات اليوم',month:'مبيعات 30 يوم',orders:'الطلبات',aov:'متوسط الطلب',profit:'صافي الربح',owner:'المالك',emp:'موظف',lang:'EN',trend:'المبيعات عبر الوقت',cmp:'مقارنة الفروع (7 أيام)',top:'أفضل 5 منتجات',cat:'المبيعات حسب الفئة',low:'مخزون منخفض',dead:'مخزون راكد (60+ يوم)',lead:'ترتيب الموظفين',feed:'آخر النشاطات',sim:'محاكاة حدث'}};
const t=k=>L[S.lang][k]||k;

/* ===== Seeded random for stable mock data ===== */
let R=7;const rnd=()=>(R=(R*16807)%2147483647)/2147483647;
const BR={ISM:'Ismailia',CAI:'Cairo'};
const money=n=>Math.round(n).toLocaleString('en-US')+' EGP';
const toM=s=>{const[a,b]=s.split(':');return +a*60+ +b};
const fm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(Math.round(m%60)).padStart(2,'0');
const nowM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const nowS=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const TODAY=new Date(),DAY=TODAY.getDate(),DIM=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0).getDate(),DOW1=new Date(TODAY.getFullYear(),TODAY.getMonth(),1).getDay();
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ===== Mock data: products (40) ===== */
const CATS={Shirts:['Oxford Shirt','Linen Shirt','Polo','Denim Shirt','Basic Tee','Striped Tee','Flannel Shirt','Henley','Mandarin Shirt','Hoodie'],Pants:['Chinos','Slim Jeans','Cargo','Joggers','Linen Trousers','Shorts','Wide Jeans','Pleated Trousers','Bermuda','Track Pants'],Shoes:['Leather Sneaker','Loafer','Canvas Sneaker','Chelsea Boot','Sandal','Runner','Derby','Slide','Espadrille','High-top'],Accessories:['Leather Belt','Wool Scarf','Cap','Sunglasses','Wallet','Watch','Tote Bag','Socks Pack','Beanie','Tie']};
const BASE={Shirts:650,Pants:900,Shoes:1700,Accessories:450},SZ={Shirts:['S','M','L','XL'],Pants:['30','32','34','36'],Shoes:['40','41','42','43'],Accessories:['One size']},COL=['Black','Navy','Sand','Olive','White','Burgundy'];
const P=[];let pid=0;
for(const c in CATS)CATS[c].forEach(n=>{const price=Math.round(BASE[c]*(.8+rnd()*.6)/10)*10;const lowish=rnd()<.25;
 P.push({id:pid++,n,c,price,cost:Math.round(price*(.45+rnd()*.15)),sz:pick(SZ[c]),col:pick(COL),q:{ISM:lowish?Math.floor(rnd()*5):6+Math.floor(rnd()*30),CAI:rnd()<.15?Math.floor(rnd()*4):8+Math.floor(rnd()*35)},sold:{ISM:Math.floor(rnd()*90),CAI:Math.floor(rnd()*140)},last:rnd()<.16?60+Math.floor(rnd()*50):Math.floor(rnd()*30),disc:false})});

/* ===== Mock data: 60 days of sales per branch (weekends = Fri/Sat higher) ===== */
const D={ISM:[],CAI:[]};
for(const b in D)for(let i=0;i<60;i++){const dt=new Date(TODAY);dt.setDate(DAY-(59-i));const w=[5,6].includes(dt.getDay())?1.35:1;const base=b==='ISM'?14000:21000;const r=base*(.75+rnd()*.5)*w*(1+i*.002);D[b].push({r,o:Math.round(r/(b==='ISM'?640:720)),d:dt.getDate()})}

/* ===== Mock data: employees + attendance ===== */
const E=[['Mahmoud Adel','ISM','Branch Manager',9000],['Nourhan Samir','ISM','Sales',6000],['Youssef Hany','ISM','Sales',6000],['Salma Tarek','ISM','Cashier',5500],['Omar Khaled','CAI','Branch Manager',10000],['Hagar Ali','CAI','Sales',6500],['Karim Fathy','CAI','Sales',6500],['Dina Mostafa','CAI','Cashier',6000]].map((e,i)=>{
 const rec=[];for(let d=1;d<DAY;d++){const dw=new Date(TODAY.getFullYear(),TODAY.getMonth(),d).getDay(),x=rnd();rec.push({s:dw===5?'O':x<.8?'P':x<.92?'L':x<.97?'A':'V',ot:rnd()<.25?+(1+Math.floor(rnd()*3)*.5).toFixed(1):0})}
 const sh=i%4===3?'13:00':'09:00';
 return{id:i,name:e[0],b:e[1],role:e[2],base:e[3],shift:sh,target:70000,sales:Math.round(70000*(.35+rnd()*.6)),rec,t:{in:'',out:'',st:'none',ot:0}}});
// today's initial state
const setT=(i,st,inn,out)=>{E[i].t={in:inn||'',out:out||'',st,ot:0}};
setT(0,'ontime','08:55');setT(1,'late','09:32');setT(2,'ontime','08:58','17:10');setT(3,'leave');setT(4,'ontime','08:50');setT(5,'absent');setT(6,'ontime','09:05');setT(7,'none');
E[2].t.ot=0;
const fri=new Date().getDay()===5;

/* ===== App state ===== */
const S={lang:'en',role:'owner',page:'dash',br:'ALL',rng:7,eid:1,cal:0,thr:5,rate:3,open:false,menu:false,nt:[],log:[],pos:[],leaves:[{id:1,e:2,date:'',reason:'Family event',st:'pending'}],wa:'',sumTime:'22:00',sumDone:'',
 bd:[{n:'Rana Hossam',m:'03-14',code:''},{n:'Ahmed Zaki',m:'07-02',code:''},{n:'Mona Sherif',m:'11-23',code:''}],
 sh:{}};
E.forEach(e=>{S.sh[e.id]=Array.from({length:7},(_,d)=>d===5?'off':e.shift+'-'+fm(toM(e.shift)+480))});
const A=[
 {n:'Low-stock alert',d:'Creates a notification and a draft purchase order when quantity falls below the threshold.'},
 {n:'Late-arrival rule',d:'Flags an employee as Late when check-in is 15+ minutes after shift start.'},
 {n:'Absence alert',d:'Notifies the owner if there is no check-in 30 minutes after shift start.'},
 {n:'Auto overtime',d:'Calculates overtime hours from the check-out time vs. shift end.'},
 {n:'Auto commission',d:'Calculates commission for the seller whenever a sale is recorded.'},
 {n:'Dead-stock discount',d:'Applies 20% off to items not sold for 60+ days.'},
 {n:'Daily summary',d:'Builds an end-of-day report and sends it as a WhatsApp-style message.'},
 {n:'Birthday coupon',d:'Generates a 15% coupon for customers on their birthday.'}].map(a=>({...a,on:true,last:'—'}));
const logAdd=(type,msg)=>{S.log.unshift({t:nowS(),type,msg});S.log=S.log.slice(0,30)};
['Branch opened — Cairo','Sale: Chinos (CAI) 1,020 EGP','Alert: Nourhan Samir checked in late'].forEach(m=>logAdd('i',m));
function toast(m){const d=document.createElement('div');d.textContent=m;$('#toast').append(d);setTimeout(()=>d.remove(),3800)}
const $=s=>document.querySelector(s);
function notify(m){S.nt.unshift({m,t:nowS(),r:false})}
function fire(i,m,nf=true){A[i].last=nowS();logAdd('a',m);if(nf)notify(m);toast('⚡ '+m)}

/* ===== Helpers ===== */
const sel=()=>S.br==='ALL'?['ISM','CAI']:[S.br];
function ser(n,off=0){const bs=sel();return Array.from({length:n},(_,i)=>{const x=60-n-off+i;let r=0,o=0,d=0;bs.forEach(b=>{r+=D[b][x].r;o+=D[b][x].o;d=D[b][x].d});return{r,o,d}})}
const sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);
const pc=(a,b)=>{const p=b?(a-b)/b*100:0;return`<span class="${p>=0?'up':'dn'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(1)}%</span>`};
const stLabel={ontime:'On time',late:'Late',absent:'Absent',leave:'On leave',none:'Not in yet'};
const pill=s=>`<span class="pill p-${s}">${stLabel[s]||s}</span>`;
const empIn=()=>E.filter(e=>S.br==='ALL'||e.b===S.br);

/* ===== SVG charts ===== */
function line(v,lb){const W=560,H=170,m=28,mx=Math.max(...v)*1.1,x=i=>m+i*(W-m*2)/(v.length-1||1),y=a=>H-m-a/mx*(H-m*2);
 const pts=v.map((a,i)=>x(i)+','+y(a)).join(' ');
 return`<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline points="${m},${H-m} ${pts} ${x(v.length-1)},${H-m}" fill="#b8613f22" stroke="none"/><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5"/>`+
 v.map((a,i)=>(v.length<=10||i%5===0)?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${lb[i]}</text>`:'').join('')+`<text x="2" y="14">${Math.round(mx/1000)}k</text></svg>`}
function bars2(lb,a,b){const W=560,H=170,m=24,mx=Math.max(...a,...b)*1.1,w=(W-m*2)/lb.length;
 return`<svg viewBox="0 0 ${W} ${H}" width="100%">`+lb.map((l,i)=>{const h1=a[i]/mx*(H-m*2),h2=b[i]/mx*(H-m*2),x=m+i*w;return`<rect x="${x+4}" y="${H-m-h1}" width="${w/2-5}" height="${h1}" rx="3" fill="var(--acc)"/><rect x="${x+w/2}" y="${H-m-h2}" width="${w/2-5}" height="${h2}" rx="3" fill="var(--ink)"/><text x="${x+w/2}" y="${H-8}" text-anchor="middle">${l}</text>`}).join('')+`<text x="2" y="12">■ Ismailia  ■ Cairo</text></svg>`}
function hb(items,fmt=x=>x){const mx=Math.max(...items.map(i=>i.v),1);return items.map(i=>`<div style="margin:9px 0"><div style="display:flex;justify-content:space-between"><span>${i.l}</span><b>${fmt(i.v)}</b></div><div class="bar"><i style="width:${i.v/mx*100}%"></i></div></div>`).join('')}

/* ===== Pages ===== */
function dash(){
 const td=ser(1)[0],yd=ser(1,1)[0],m=ser(30),pm=ser(30,30),mr=sum(m,'r'),pr=sum(pm,'r'),mo=sum(m,'o'),po=sum(pm,'o');
 const kp=[[t('today'),money(td.r),pc(td.r,yd.r)],[t('month'),money(mr),pc(mr,pr)],[t('orders'),mo,pc(mo,po)],[t('aov'),money(mr/mo),pc(mr/mo,pr/po)],[t('profit'),money(mr*.34),pc(mr,pr)]];
 const s=ser(S.rng),bs=sel();
 const top=[...P].map(p=>({l:p.n,v:bs.reduce((a,b)=>a+p.sold[b],0)})).sort((a,b)=>b.v-a.v).slice(0,5);
 const cats=Object.keys(CATS).map(c=>({l:c,v:P.filter(p=>p.c===c).reduce((a,p)=>a+bs.reduce((x,b)=>x+p.sold[b]*p.price,0),0)}));
 const w=Array.from({length:7},(_,i)=>59-6+i),lowL=lows().slice(0,6),dd=deads().slice(0,5);
 return`<div class="grid g5">${kp.map(k=>`<div class="card kpi"><small>${k[0]}</small><div class="v">${k[1]}</div>${k[2]} <small>vs previous</small></div>`).join('')}</div>
 <div class="grid g2" style="margin-top:14px">
 <div class="card"><h3>${t('trend')}</h3><div class="seg" style="margin-bottom:8px"><button class="${S.rng==7?'on':''}" onclick="S.rng=7;render()">7 days</button><button class="${S.rng==30?'on':''}" onclick="S.rng=30;render()">30 days</button></div>${line(s.map(x=>x.r),s.map(x=>x.d))}</div>
 <div class="card"><h3>${t('cmp')}</h3>${bars2(w.map(i=>D.ISM[i].d),w.map(i=>D.ISM[i].r),w.map(i=>D.CAI[i].r))}</div>
 <div class="card"><h3>${t('top')}</h3>${hb(top,v=>v+' sold')}</div>
 <div class="card"><h3>${t('cat')}</h3>${hb(cats,money)}</div>
 <div class="card"><h3>${t('low')}</h3>${lowTbl(lowL)}</div>
 <div class="card"><h3>${t('dead')}</h3>${deadTbl(dd)}</div>
 <div class="card"><h3>${t('lead')}</h3>${empIn().map(e=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${e.name} <small style="color:var(--mut)">${BR[e.b]}</small></span><span>${money(e.sales)} · <b>${money(e.sales*S.rate/100)}</b></span></div><div class="bar"><i style="width:${Math.min(100,e.sales/e.target*100)}%"></i></div></div>`).join('')}</div>
 <div class="card"><h3>${t('feed')}</h3><div class="feed">${S.log.slice(0,9).map(l=>`<div><small>${l.t}</small><span>${l.type==='a'?'⚡ ':''}${l.msg}</span></div>`).join('')}</div></div></div>`}
function lows(){const r=[];P.forEach(p=>sel().forEach(b=>{if(p.q[b]<S.thr)r.push({p,b})}));return r.sort((a,b)=>a.p.q[a.b]-b.p.q[b.b])}
function deads(){return P.filter(p=>p.last>=60&&sel().some(b=>p.q[b]>0))}
const lowTbl=a=>a.length?`<div class="wrap"><table><tr><th>Product</th><th>Size</th><th>Color</th><th>Qty</th><th>Branch</th></tr>${a.map(x=>`<tr><td>${x.p.n}</td><td>${x.p.sz}</td><td>${x.p.col}</td><td><b class="dn">${x.p.q[x.b]}</b></td><td>${BR[x.b]}</td></tr>`).join('')}</table></div>`:'<div class="empty">Nothing is running low 🎉</div>';
const deadTbl=a=>a.length?`<div class="wrap"><table><tr><th>Product</th><th>Days idle</th><th>Price</th></tr>${a.map(p=>`<tr><td>${p.n}</td><td>${p.last}</td><td>${money(p.price)} ${p.disc?'<span class="pill p-ontime">-20%</span>':`<button class="btn sm o" onclick="disc(${p.id})">Apply 20%</button>`}</td></tr>`).join('')}</table></div>`:'<div class="empty">No dead stock</div>';
function disc(id){const p=P[id];p.price=Math.round(p.price*.8);p.disc=true;logAdd('i',`Discount 20% applied to ${p.n}`);toast('20% applied to '+p.n);render()}

function inv(){const bs=sel();return`<div class="grid g2"><div class="card" style="grid-column:1/-1"><h3>All products (${P.length})</h3><div class="wrap"><table><tr><th>Product</th><th>Category</th><th>Size/Color</th><th>Cost</th><th>Price</th>${bs.map(b=>`<th>${BR[b]}</th>`).join('')}</tr>${P.map(p=>`<tr><td>${p.n}</td><td>${p.c}</td><td>${p.sz} · ${p.col}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td>${bs.map(b=>`<td class="${p.q[b]<S.thr?'dn':''}"><b>${p.q[b]}</b></td>`).join('')}</tr>`).join('')}</table></div></div>
 <div class="card"><h3>Draft purchase orders</h3>${S.pos.length?`<table><tr><th>Item</th><th>Branch</th><th>Qty</th><th></th></tr>${S.pos.map((o,i)=>`<tr><td>${o.n}</td><td>${BR[o.b]}</td><td>${o.q}</td><td><button class="btn sm" onclick="S.pos.splice(${i},1);toast('PO sent to supplier');render()">Send</button></td></tr>`).join('')}</table>`:'<div class="empty">No drafts yet. Run "Simulate low stock".</div>'}</div>
 <div class="card"><h3>${t('dead')}</h3>${deadTbl(deads())}</div></div>`}

/* ---- Attendance ---- */
function dayStat(e,d){if(d<DAY-1)return e.rec[d].s;if(d===DAY-1){if(fri)return'O';return{ontime:'P',late:'L',absent:'A',leave:'V',none:''}[e.t.st]}return''}
function summ(e){let p=0,l=0,a=0,ot=0;for(let d=0;d<DAY;d++){const s=dayStat(e,d);if(s==='P'||s==='L')p++;if(s==='L')l++;if(s==='A')a++;if(d<DAY-1)ot+=e.rec[d].ot}ot+=e.t.ot;const rate=e.base/26;return{p,l,a,ot,sal:rate*p+ot*rate/8*1.5}}
function calHtml(e){let h=['S','M','T','W','T','F','S'].map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(DOW1);
 for(let d=0;d<DIM;d++){const s=d<DAY?dayStat(e,d):'';h+=`<div class="${s?'p-'+s:''}" style="${s?'':'background:var(--line)'}">${d+1}</div>`}
 return`<div class="cal">${h}</div><p style="color:var(--mut);font-size:12px"><span class="pill p-P">Present</span> <span class="pill p-L">Late</span> <span class="pill p-A">Absent</span> <span class="pill p-V">Leave</span> <span class="pill p-O">Off</span></p>`}
function att(){return S.role==='owner'?attOwner():attEmp()}
function attEmp(){const e=E[S.eid],tt=e.t,inn=tt.in&&!tt.out,sm=summ(e);
 return`<div class="grid g2"><div class="card"><h3>Hello, ${e.name}</h3><div style="color:var(--mut);text-align:center">${BR[e.b]} · shift ${e.shift}</div><div class="big" id="clk">${new Date().toLocaleTimeString('en-GB')}</div>
 <button class="bigbtn ${inn?'out':''}" onclick="${inn?'checkOut':'checkIn'}(${e.id})">${inn?'Check out':(tt.out?'Checked out ✓':'Check in')}</button>
 <div style="text-align:center">Today: ${pill(tt.st)} ${tt.in?`in ${tt.in}`:''} ${tt.out?`· out ${tt.out}`:''}</div></div>
 <div class="card"><h3>My month</h3>${calHtml(e)}<p>Present <b>${sm.p}</b> · Late <b>${sm.l}</b> · Absent <b>${sm.a}</b> · Overtime <b>${sm.ot}h</b></p></div>
 <div class="card"><h3>Request leave</h3><input type="date" id="lvd"> <input type="text" id="lvr" placeholder="Reason"> <button class="btn" onclick="reqLeave()">Submit</button>
 ${S.leaves.filter(l=>l.e===e.id).map(l=>`<p>${l.date||'—'} · ${l.reason} <span class="pill ${l.st==='approved'?'p-ontime':l.st==='rejected'?'p-absent':'p-late'}">${l.st}</span></p>`).join('')}</div></div>`}
function attOwner(){const es=empIn(),e=E[S.cal];
 return`<div class="grid g2"><div class="card" style="grid-column:1/-1"><h3>Today</h3><div class="wrap"><table><tr><th>Employee</th><th>Branch</th><th>Shift</th><th>In</th><th>Out</th><th>Status</th><th>Hours</th><th>Overtime</th></tr>${es.map(x=>{const h=x.t.in&&x.t.out?((toM(x.t.out)-toM(x.t.in))/60).toFixed(1):'—';return`<tr><td>${x.name}</td><td>${BR[x.b]}</td><td>${x.shift}</td><td>${x.t.in||'—'}</td><td>${x.t.out||'—'}</td><td>${pill(x.t.st)}</td><td>${h}</td><td>${x.t.ot||0}h</td></tr>`}).join('')}</table></div></div>
 <div class="card"><h3>Monthly calendar</h3><select onchange="S.cal=+this.value;render()">${E.map(x=>`<option value="${x.id}" ${x.id===S.cal?'selected':''}>${x.name}</option>`).join('')}</select><div style="margin-top:10px">${calHtml(e)}</div></div>
 <div class="card"><h3>Monthly summary</h3><div class="wrap"><table><tr><th>Employee</th><th>Present</th><th>Late</th><th>Absent</th><th>OT h</th><th>Salary est.</th></tr>${es.map(x=>{const s=summ(x);return`<tr><td>${x.name}</td><td>${s.p}</td><td>${s.l}</td><td>${s.a}</td><td>${s.ot}</td><td><b>${money(s.sal)}</b></td></tr>`}).join('')}</table></div></div>
 <div class="card"><h3>Leave requests</h3>${S.leaves.length?S.leaves.map(l=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)">${E[l.e].name} · ${l.date||'date TBD'} · ${l.reason} ${l.st==='pending'?`<button class="btn sm" onclick="decide(${l.id},'approved')">Approve</button> <button class="btn sm o" onclick="decide(${l.id},'rejected')">Reject</button>`:`<span class="pill ${l.st==='approved'?'p-ontime':'p-absent'}">${l.st}</span>`}</div>`).join(''):'<div class="empty">No requests</div>'}</div>
 <div class="card" style="grid-column:1/-1"><h3>Weekly shifts (click a cell to add or edit)</h3><div class="wrap"><table><tr><th>Employee</th>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<th>${d}</th>`).join('')}</tr>${es.map(x=>`<tr><td>${x.name}<br><small style="color:var(--mut)">${BR[x.b]}</small></td>${S.sh[x.id].map((s,d)=>`<td class="shift" onclick="editShift(${x.id},${d})">${s}</td>`).join('')}</tr>`).join('')}</table></div></div></div>`}
function editShift(i,d){const v=prompt('Shift (e.g. 09:00-17:00) or "off"',S.sh[i][d]);if(v!==null&&v.trim()){S.sh[i][d]=v.trim();if(/^\d\d:\d\d-/.test(v))E[i].shift=v.slice(0,5);toast('Shift updated');render()}}
function reqLeave(){const d=$('#lvd').value,r=$('#lvr').value||'Personal';S.leaves.push({id:Date.now(),e:S.eid,date:d,reason:r,st:'pending'});notify(`${E[S.eid].name} requested leave (${d||'TBD'})`);logAdd('i',`Leave request from ${E[S.eid].name}`);toast('Leave request submitted');render()}
function decide(id,st){const l=S.leaves.find(x=>x.id===id);l.st=st;if(st==='approved'&&l.date===TODAY.toISOString().slice(0,10))E[l.e].t.st='leave';logAdd('i',`Leave ${st}: ${E[l.e].name}`);toast('Leave '+st);render()}

/* ---- Check in / out with automations ---- */
function checkIn(id,at){const e=E[id],m=at!=null?at:nowM(),diff=m-toM(e.shift);e.t.in=fm(m);e.t.out='';e.t.st='ontime';
 if(A[1].on&&diff>15){e.t.st='late';fire(1,`${e.name} checked in late (${diff} min) — flagged Late`)}else logAdd('i',`${e.name} checked in ${fm(m)}`);
 toast(e.name+' checked in');render()}
function checkOut(id,at){const e=E[id],m=at!=null?at:nowM();e.t.out=fm(m);const end=toM(e.shift)+480;
 if(A[3].on&&m>end){e.t.ot=+((m-end)/60).toFixed(1);fire(3,`Overtime ${e.t.ot}h calculated for ${e.name}`,false)}else logAdd('i',`${e.name} checked out ${fm(m)}`);render()}

/* ---- Automations page + simulations ---- */
function checkLow(p,b){if(A[0].on&&p.q[b]<S.thr&&!S.pos.some(o=>o.id===p.id&&o.b===b)){S.pos.push({id:p.id,n:`${p.n} (${p.sz}, ${p.col})`,b,q:20});fire(0,`Low stock: ${p.n} in ${BR[b]} (${p.q[b]} left) — draft PO created`)}}
function simSale(){const ps=P.filter(p=>p.q.ISM+p.q.CAI>0),p=pick(ps),b=p.q.ISM&&p.q.CAI?pick(['ISM','CAI']):(p.q.ISM?'ISM':'CAI'),e=pick(E.filter(x=>x.b===b));
 p.q[b]--;p.sold[b]++;p.last=0;D[b][59].r+=p.price;D[b][59].o++;e.sales+=p.price;logAdd('s',`Sale: ${p.n} (${BR[b]}) ${money(p.price)} by ${e.name}`);toast('🛍 Sale recorded: '+money(p.price));
 if(A[4].on)fire(4,`Commission +${money(p.price*S.rate/100)} for ${e.name}`,false);checkLow(p,b);render()}
function simLate(){const c=E.filter(e=>['none','absent'].includes(e.t.st));if(!c.length)return toast('Everyone already checked in');const e=pick(c);checkIn(e.id,toM(e.shift)+22)}
function simAbsent(){const c=E.filter(e=>e.t.st==='none');if(!c.length)return toast('No employees pending');const e=pick(c);e.t.st='absent';if(A[2].on)fire(2,`${e.name} has not checked in 30 min after shift start`);else toast(e.name+' marked absent');render()}
function simLow(){const p=pick(P.filter(p=>p.q.CAI>S.thr)),b='CAI';p.q[b]=S.thr-2;logAdd('s',`Stock drop: ${p.n} (${BR[b]})`);checkLow(p,b);render()}
function simOT(){const c=E.filter(e=>e.t.in&&!e.t.out);if(!c.length)return toast('Nobody is checked in');const e=pick(c);checkOut(e.id,toM(e.shift)+480+90)}
function simDead(){if(!A[5].on)return toast('Automation is OFF');const d=P.filter(p=>p.last>=60&&!p.disc);if(!d.length)return toast('No dead stock left');d.forEach(p=>{p.price=Math.round(p.price*.8);p.disc=true});fire(5,`20% discount applied to ${d.length} dead-stock items`);render()}
function simSummary(){if(!A[6].on)return toast('Automation is OFF');const tot=D.ISM[59].r+D.CAI[59].r,top=[...P].sort((a,b)=>(b.sold.ISM+b.sold.CAI)-(a.sold.ISM+a.sold.CAI))[0],late=E.filter(e=>e.t.st==='late').length,ab=E.filter(e=>e.t.st==='absent').length;
 S.wa=`📊 ANTIGO daily report\nSales today: ${money(tot)}\nTop product: ${top.n}\nAttendance issues: ${late} late, ${ab} absent`;fire(6,'Daily summary generated');render()}
function simBday(){if(!A[7].on)return toast('Automation is OFF');const c=pick(S.bd);c.m=TODAY.toISOString().slice(5,10);c.code='BDAY-'+Math.floor(1000+Math.random()*9000);fire(7,`Birthday coupon ${c.code} sent to ${c.n}`);render()}
const SIMS=[['🛍 Simulate a sale','simSale'],['⏰ Late check-in','simLate'],['🚫 Absence (30 min)','simAbsent'],['📦 Low stock','simLow'],['🌙 Overtime check-out','simOT'],['🏷 Dead-stock scan','simDead'],['📊 Daily summary','simSummary'],['🎂 Birthday','simBday']];
function auto(){return`<div class="card" style="margin-bottom:14px"><h3>${t('sim')}</h3><div style="display:flex;gap:8px;flex-wrap:wrap">${SIMS.map(s=>`<button class="btn o" onclick="${s[1]}()">${s[0]}</button>`).join('')}</div>
 <p>Low-stock threshold <input type="number" min="1" value="${S.thr}" style="width:70px" onchange="S.thr=+this.value;render()"> · Commission % <input type="number" min="0" step="0.5" value="${S.rate}" style="width:70px" onchange="S.rate=+this.value;render()"> · Daily summary at <input type="time" value="${S.sumTime}" onchange="S.sumTime=this.value"></p></div>
 <div class="grid g2">${A.map((a,i)=>`<div class="card acard"><button class="tg ${a.on?'on':''}" aria-label="toggle" onclick="A[${i}].on=!A[${i}].on;render()"></button><div><b>${a.n}</b><p>${a.d}</p><small style="color:var(--mut)">Last triggered: ${a.last}</small></div></div>`).join('')}</div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><h3>WhatsApp preview</h3>${S.wa?`<div class="wa">${S.wa}</div>`:'<div class="empty">Run "Daily summary" to see the message.</div>'}</div>
 <div class="card"><h3>Birthday customers</h3><table>${S.bd.map(c=>`<tr><td>${c.n}</td><td>${c.m}</td><td>${c.code?`<span class="pill p-ontime">${c.code}</span>`:'—'}</td></tr>`).join('')}</table></div></div>`}

/* ===== Shell ===== */
function render(){
 const d=document.documentElement;d.dir=S.lang==='ar'?'rtl':'ltr';d.lang=S.lang;
 if(S.role==='employee')S.page='att';
 const pages=S.role==='owner'?['dash','att','inv','auto']:['att'];
 const body={dash,att,inv,auto}[S.page]();
 const unread=S.nt.filter(n=>!n.r).length;
 $('#app').innerHTML=`<aside class="${S.menu?'open':''}"><div class="logo">ANTI<span>G</span>O</div>${pages.map(p=>`<button class="nav ${S.page===p?'on':''}" onclick="S.page='${p}';S.menu=false;render()">${t(p)}</button>`).join('')}</aside>
 <div class="main"><header><button class="ib burger" onclick="S.menu=!S.menu;render()">☰</button><h2 style="font-size:22px">${t(S.page)}</h2><span class="sp"></span>
 ${S.role==='owner'?`<select onchange="S.br=this.value;render()"><option value="ALL">${t('all')}</option><option value="ISM" ${S.br==='ISM'?'selected':''}>Ismailia</option><option value="CAI" ${S.br==='CAI'?'selected':''}>Cairo</option></select>`:`<select onchange="S.eid=+this.value;render()">${E.map(e=>`<option value="${e.id}" ${e.id===S.eid?'selected':''}>${e.name}</option>`).join('')}</select>`}
 <div class="seg"><button class="${S.role==='owner'?'on':''}" onclick="S.role='owner';render()">${t('owner')}</button><button class="${S.role==='employee'?'on':''}" onclick="S.role='employee';render()">${t('emp')}</button></div>
 <button class="ib" onclick="S.lang=S.lang==='en'?'ar':'en';render()">${t('lang')}</button>
 <div class="bell"><button class="ib" aria-label="Notifications" onclick="S.open=!S.open;if(S.open)S.nt.forEach(n=>n.r=true);render()">🔔</button>${unread?`<b>${unread}</b>`:''}${S.open?`<div class="dd">${S.nt.length?S.nt.map(n=>`<div>${n.m}<small>${n.t}</small></div>`).join(''):'<div class="empty">No notifications</div>'}</div>`:''}</div></header>
 <section class="pg">${body}</section></div>`}

/* ---- Live clock + scheduled daily summary ---- */
setInterval(()=>{const c=$('#clk');if(c)c.textContent=new Date().toLocaleTimeString('en-GB');
 if(nowS()===S.sumTime&&S.sumDone!==TODAY.toDateString()+S.sumTime){S.sumDone=TODAY.toDateString()+S.sumTime;simSummary()}},1000);
render();
</script>
</body>
</html>
